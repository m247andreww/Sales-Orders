[alembic]
script_location = migrations
# New revision: alembic revision --rev-id 0003 -m "add x"  -> migrations/versions/0003_add_x.py
# then write migrations/sql/0003_add_x.up.sql and .down.sql (same stem).
file_template = %%(rev)s_%%(slug)s
path_separator = space
prepend_sys_path = src migrations
# The database URL is NOT stored here. It comes from SALES_ORDERS_DATABASE_URL (see migrations/env.py).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
