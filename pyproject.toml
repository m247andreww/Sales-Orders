[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-orders"
version = "0.1.0"
description = "Managed247 sales order system of record"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "cryptography>=43,<47",
    "psycopg[binary]>=3.2,<4",
    "pydantic[email]>=2.7,<3",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
sales-orders = "sales_orders.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sales_orders = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PL"]
# E501: the formatter owns line length (SQL literals may run long).
ignore = ["PLR0913", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "PLR0917"]  # pytest fixtures are positional by design
"migrations/**" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["sales_orders"]
plugins = ["pydantic.mypy"]
